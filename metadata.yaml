name: astrbot_plugin_always_paraphrase_image
display_name: Always Paraphrase Image
short_desc: Force every main-model request to use text captions instead of images.
desc: >-
  Converts current images, plugin-added image parts, and historical conversation
  images into text captions before each main-model request. This keeps a session
  text-only and prevents large image payloads from bloating the model API body,
  even when the main model supports image input.
version: 1.0.0
author: Astricaelus
repo: https://github.com/Astricaelus/Always-Paraphrase-Image
astrbot_version: ">=4.29.0,<5.0.0"
